# Downloads the latest publication list from PubMed every Monday and commits
# any changes. GitHub Pages then rebuilds the site automatically.
# Can also be run by hand: GitHub → Actions → "Update publications" → Run workflow.
name: Update publications

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from PubMed
        run: python scripts/fetch_pubmed.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/publications_auto.json; then
            echo "No new publications."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/publications_auto.json
            git commit -m "Update publications from PubMed"
            git push
          fi
