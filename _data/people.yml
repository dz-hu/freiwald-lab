# ------------------------------------------------------------------
#  Lab members, grouped as they appear on the People page.
#
#  To add someone: copy an existing entry inside the right group and edit it.
#  To move someone to Alumni: cut their entry and paste it under "Alumni"
#  (you can add `now:` to say where they went).
#
#  Fields (all optional except name and title):
#    name:   Display name
#    title:  Position
#    email:  (only shown if show_member_emails is true in _config.yml)
#    photo:  /assets/img/people/<file>.jpg   (square, ~600x600 px; leave empty for initials)
#    bio:    One or two sentences
#    links:  website / scholar / orcid / github / x / bluesky / linkedin
#    now:    (alumni only) current position
# ------------------------------------------------------------------

